<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026 연말 걸스파티</title>
<meta property="og:title" content="2026 연말 걸스파티 🍷">
<meta property="og:description" content="11/27(금) 오후 7시 · 로마옥 도곡 · 와인과 함께하는 우리만의 연말 파티">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root { --cream: #f7f1e8; --ink: #3b2a22; --muted: #8a7566; --line: #e2d4c0; --red: #a51c2a; --green: #2f5d3a; --brown: #7a4b2a; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--cream); color: var(--ink); font-family: 'Gowun Batang', serif; line-height: 1.7; }
  main { max-width: 420px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }
  .script { font-family: 'Playfair Display', serif; font-style: italic; color: var(--red); }
  h1 { font-size: 28px; margin: 4px 0 28px; }
  .info { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 20px 4px; text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
  .info dt { color: var(--brown); font-weight: 700; }
  .info dd { margin: 0; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; }
  .map { margin-top: 20px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
  .map iframe { display: block; width: 100%; height: 200px; border: 0; }
  .map a { display: block; padding: 10px; color: var(--green); font-weight: 700; text-decoration: none; font-size: 14px; }
  .map small { display: block; color: var(--muted); font-size: 12px; padding: 8px 10px 0; }
  .msg { margin: 32px 0; }
  .hello { margin: 36px 0 14px; font-weight: 700; }
  .tag { margin: 0 0 16px; font-size: 15px; }
  .tag b { color: var(--red); font-size: 20px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card { perspective: 800px; height: 200px; padding: 0; border: 0; background: none; font: inherit; color: inherit; cursor: pointer; }
  .inner { position: relative; height: 100%; transition: transform .6s; transform-style: preserve-3d; }
  .card.open .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px; padding: 12px; }
  .front { color: #fff; background: var(--red); }
  .card.gift .front { background: var(--green); }
  .back { background: #fff; border: 1px solid var(--line); transform: rotateY(180deg); }
  .big { font-size: 26px; font-weight: 700; }
  .small { font-size: 13px; color: var(--muted); }
  .swatch { width: 44px; height: 44px; border-radius: 50%; }
  .cheers { font-size: 22px; margin-top: 44px; }
</style>
</head>
<body>
<main>
  <p class="script">You're invited</p>
  <h1>2026 연말 걸스파티</h1>

  <dl class="info">
    <dt>일시</dt><dd>11/27(금) 오후 7시</dd>
    <dt>장소</dt><dd>로마옥 도곡</dd>
    <dt>드레스코드</dt><dd><span class="dot" style="background:var(--red)"></span><span class="dot" style="background:var(--green)"></span><span class="dot" style="background:var(--brown)"></span> 레드 · 그린 · 브라운 포인트 컬러</dd>
    <dt>선물</dt><dd>2만원 미만 선물 하나씩 준비하기<br>(번호 붙여 오기, 당일 7시 랜덤 오픈)</dd>
  </dl>

  <div class="map">
    <iframe title="로마옥 도곡 위치" loading="lazy"
      src="https://www.openstreetmap.org/export/embed.html?bbox=127.0311%2C37.4851%2C127.0371%2C37.4887&layer=mapnik&marker=37.4869199%2C127.0341174"></iframe>
    <small>서울 강남구 강남대로48길 11 1층</small>
    <a href="https://naver.me/FQVGsm3j">네이버 지도로 길찾기</a>
  </div>

  <p class="msg">와인과 함께하는 우리만의 연말 파티<br>예쁘게 차려입고 맛있는 거 먹으면서<br>행복한 추억 만들어보자</p>

  <section id="draw" hidden>
    <p class="hello"><span id="name"></span>님, 카드를 눌러 뽑아 보세요</p>
    <p class="tag">내 선물엔 <b id="tag"></b>번을 붙여 와 주세요</p>
    <div class="cards">
      <button class="card" type="button" aria-label="드레스코드 뽑기">
        <div class="inner">
          <div class="face front"><span class="small" style="color:#fff">내 포인트 컬러</span><span class="big">?</span></div>
          <div class="face back"><div class="swatch" id="swatch"></div><span class="big" id="color"></span><span class="small">포인트 컬러</span></div>
        </div>
      </button>
      <button class="card gift" type="button" aria-label="선물 뽑기">
        <div class="inner">
          <div class="face front"><span class="small" style="color:#fff">랜덤 선물</span><span class="big">?</span><span class="small" style="color:#fff" id="lock">11/27 오후 7시에 열려요</span></div>
          <div class="face back"><span class="big"><span id="take"></span>번</span><span class="small">선물을 가져가요</span></div>
        </div>
      </button>
    </div>
  </section>

  <p class="script cheers">Dress up &amp; Cheers! 🥂</p>
</main>

<script>
  // 링크 # 뒤에 assign.js 가 넣어 둔 내 결과가 있다. 없으면 초대장만 보여 준다.
  const COLORS = { 레드: '#a51c2a', 그린: '#2f5d3a', 브라운: '#7a4b2a' };
  // ponytail: 휴대폰 시계 기준이라 날짜를 바꾸면 미리 열린다. 친구끼리라 이 정도로 둔다.
  const OPEN_AT = new Date('2026-11-27T19:00:00+09:00');
  const isOpen = () => Date.now() >= OPEN_AT;
  let me;
  try {
    const b64 = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    me = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))));
    document.getElementById('name').textContent = me.name;
    document.getElementById('color').textContent = me.color;
    document.getElementById('swatch').style.background = COLORS[me.color];
    document.getElementById('tag').textContent = me.myTag;
    if (isOpen()) document.getElementById('lock').textContent = '탭해서 열기';
    document.getElementById('draw').hidden = false;
  } catch {}
  document.querySelectorAll('.card').forEach(c => c.onclick = () => {
    // 시간 확인은 누르는 순간에 한다. 페이지를 켜 둔 채 7시를 넘겨도 열린다.
    if (c.classList.contains('gift')) {
      if (!isOpen()) return;
      document.getElementById('take').textContent = me.take;
    }
    c.classList.toggle('open');
  });
</script>
</body>
</html>
